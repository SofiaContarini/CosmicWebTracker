<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cosmic Web | Hand Tracked Pretzel Hunt</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #010103; 
            color: white; font-family: sans-serif; 
        }
        #canvas-container { 
            width: 100vw; height: 100vh; position: absolute; z-index: 1; 
        }
        #ui-layer { 
            position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; 
        }
        #video-container { 
            position: absolute; bottom: 20px; right: 20px; width: 240px; height: 180px;
            z-index: 10; border-radius: 12px; border: 2px solid #555; 
            overflow: hidden; background-color: #000;
        }
        #webcam-video, #webcam-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            transform: scaleX(-1); object-fit: cover;
        }
        #mode-display { 
            background: rgba(20, 20, 20, 0.8); padding: 15px 25px; 
            border-radius: 8px; font-size: 20px; font-weight: bold; border: 2px solid #555; 
        }
        
        #settings-ui {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(20, 20, 20, 0.8); padding: 15px; border-radius: 8px;
            border: 2px solid #555; display: flex; flex-direction: column; gap: 12px;
        }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }
        #settings-ui select {
            background: #222; color: white; border: 1px solid #777; 
            padding: 5px; border-radius: 4px; font-size: 16px; outline: none; cursor: pointer;
            width: 100px;
        }
        
        #gesture-legend {
            position: fixed; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: none;
        }
        .gesture-item {
            display: flex; align-items: center; margin-bottom: 10px; font-size: 16px;
        }
        .gesture-item img {
            width: 30px; 
            height: 30px; 
            margin-right: 15px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px; 
            object-fit: contain;
        }
        .gesture-item:last-child { margin-bottom: 0; }

        #countdown-overlay {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; font-weight: bold; color: #FFD700;
            display: none; z-index: 100; text-shadow: 0px 4px 20px rgba(0,0,0,0.8);
        }

        #victory-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40px; font-weight: bold; color: #FFD700;
            background: rgba(20, 20, 20, 0.9); padding: 30px; border-radius: 15px; 
            border: 4px solid #FFD700; display: none; z-index: 100; text-align: center;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        #victory-message.fade-out {
            opacity: 0;
        }

        #victory-message.minimized {
            top: auto;
            bottom: 20px;
            transform: translateX(-50%);
            font-size: 20px;
            padding: 10px 20px;
            border-width: 2px;
        }
        #victory-message.minimized span {
            font-size: 14px !important;
        }

        .open { color: #FF6400; border-color: #FF6400 !important; }
        .pointer { color: #00FF00; border-color: #00FF00 !important; }
        .two-fingers { color: #00FFFF; border-color: #00FFFF !important; }
        .restart { color: #FF00FF; border-color: #FF00FF !important; }
        .fist { color: #999999; border-color: #999999 !important; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="mode-display" class="fist">INITIALIZING...</div>
    </div>
    
    <div id="settings-ui">
        <div class="setting-row">
            <label id="label-lang" for="lang-select">Language:</label>
            <select id="lang-select">
                <option value="en" selected>English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
        <div class="setting-row">
            <label id="label-diff" for="mode-select">Difficulty:</label>
            <select id="mode-select">
                <option id="opt-easy" value="easy">Easy</option>
                <option id="opt-med" value="medium" selected>Medium</option>
                <option id="opt-hard" value="hard">Hard</option>
            </select>
        </div>
    </div>

    <div id="gesture-legend">
        <div class="gesture-item"><img src="icons/fist.png" alt="Rest"> <span id="leg-fist"><b>FIST:</b> Rest / Default</span></div>
        <div class="gesture-item"><img src="icons/open.png" alt="Orbit"> <span id="leg-open"><b>OPEN:</b> Orbit Web</span></div>
        <div class="gesture-item"><img src="icons/pointer.png" alt="Pan"> <span id="leg-pan"><b>1 FINGER:</b> Pan / Strafe</span></div>
        <div class="gesture-item"><img src="icons/two_fingers.png" alt="Fly"> <span id="leg-fly"><b>2 FINGERS:</b> Fly Forward/Back</span></div>
        <div class="gesture-item"><img src="icons/thumb_up.png" alt="Restart"> <span id="leg-thumb"><b>THUMB UP:</b> Restart Game</span></div>
    </div>
    
    <div id="countdown-overlay">3</div>
    <div id="victory-message">
        <span id="vic-title">🥨 PRETZEL FOUND! 🥨</span><br>
        <span id="vic-sub" style="font-size:20px; color:#fff;">You explored the cosmic web!</span>
    </div>
    <div id="canvas-container"></div>
    
    <div id="video-container">
        <video id="webcam-video" autoplay playsinline></video>
        <canvas id="webcam-canvas"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Localization System ---
        const i18n = {
            en: {
                pageTitle: "Cosmic Web | Hand Tracked Pretzel Hunt",
                init: "INITIALIZING...",
                labelLang: "Language:",
                labelDiff: "Difficulty:",
                optEasy: "Easy",
                optMed: "Medium",
                optHard: "Hard",
                legFist: "<b>FIST:</b> Rest / Default",
                legOpen: "<b>OPEN:</b> Orbit Web",
                legPan: "<b>1 FINGER:</b> Pan / Strafe",
                legFly: "<b>2 FINGERS:</b> Fly Forward/Back",
                legThumb: "<b>THUMB UP:</b> Restart Game",
                startMsg: "START!",
                vicTitle: "🥨 PRETZEL FOUND! 🥨",
                vicSub: "You explored the cosmic web!",
                modRest: "REST / DO NOTHING",
                modFly: "FLY / ZOOM (2 Fingers Up/Down)",
                modPan: "PAN / STRAFE (1 Finger Up)",
                modRestart: "HOLD TO RESTART",
                modOrbit: "ORBIT / ROTATE (Open Hand)"
            },
            de: {
                pageTitle: "Kosmisches Netz | Handverfolgte Brezensuche",
                init: "INITIALISIERT...",
                labelLang: "Sprache:",
                labelDiff: "Schwierigkeit:",
                optEasy: "Einfach",
                optMed: "Mittel",
                optHard: "Schwer",
                legFist: "<b>FAUST:</b> Ruhe / Standard",
                legOpen: "<b>OFFEN:</b> Netz Umkreisen",
                legPan: "<b>1 FINGER:</b> Schwenken / Bewegen",
                legFly: "<b>2 FINGER:</b> Vor/Zurück fliegen",
                legThumb: "<b>DAUMEN HOCH:</b> Spiel Neustart",
                startMsg: "LOS!",
                vicTitle: "🥨 BREZE GEFUNDEN! 🥨",
                vicSub: "Du hast das kosmische Netz erkundet!",
                modRest: "RUHE / NICHTS TUN",
                modFly: "FLIEGEN / ZOOMEN (2 Finger Hoch/Runter)",
                modPan: "SCHWENKEN / BEWEGEN (1 Finger Hoch)",
                modRestart: "HALTEN FÜR NEUSTART",
                modOrbit: "UMKREISEN / DREHEN (Offene Hand)"
            }
        };

        let currentLang = 'en';
        const langSelect = document.getElementById('lang-select');
        const modeDisplay = document.getElementById('mode-display');

        function updateLanguage() {
            currentLang = langSelect.value;
            const t = i18n[currentLang];
            
            document.getElementById('page-title').innerText = t.pageTitle;
            if (modeDisplay.innerText === i18n['en'].init || modeDisplay.innerText === i18n['de'].init) {
                modeDisplay.innerText = t.init;
            }
            document.getElementById('label-lang').innerText = t.labelLang;
            document.getElementById('label-diff').innerText = t.labelDiff;
            document.getElementById('opt-easy').innerText = t.optEasy;
            document.getElementById('opt-med').innerText = t.optMed;
            document.getElementById('opt-hard').innerText = t.optHard;
            
            document.getElementById('leg-fist').innerHTML = t.legFist;
            document.getElementById('leg-open').innerHTML = t.legOpen;
            document.getElementById('leg-pan').innerHTML = t.legPan;
            document.getElementById('leg-fly').innerHTML = t.legFly;
            document.getElementById('leg-thumb').innerHTML = t.legThumb;
            
            document.getElementById('vic-title').innerText = t.vicTitle;
            document.getElementById('vic-sub').innerText = t.vicSub;
        }

        langSelect.addEventListener('change', updateLanguage);

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.z = 250; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const pivot = new THREE.Group();
        scene.add(pivot);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); 
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 200, 300);
        scene.add(dirLight);

        const countdownOverlay = document.getElementById('countdown-overlay');

        const loader = new PLYLoader();
        loader.load('cosmic_web.ply', function (geometry) {
            geometry.computeVertexNormals();
            geometry.center();
            geometry.computeBoundingSphere();
            camera.position.z = geometry.boundingSphere.radius * 2.5; 

            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,     
                transparent: true,      
                blending: THREE.NormalBlending, 
                depthWrite: false,      
                side: THREE.DoubleSide,
                shininess: 50 
            });

            material.onBeforeCompile = function (shader) {
                shader.fragmentShader = shader.fragmentShader.replace(
                    `vec4 diffuseColor = vec4( diffuse, opacity );`,
                    `
                    float brightness = max(vColor.r, max(vColor.g, vColor.b));
                    float customAlpha = pow(brightness, 1.2) * 2.5; 
                    vec4 diffuseColor = vec4( diffuse, customAlpha );
                    `
                );
            };

            const mesh = new THREE.Mesh(geometry, material);
            pivot.add(mesh);
        });

        let bretzel;
        let bretzelFound = false;
        let secretBlinkActive = false;
        let auras = []; 
        const gltfLoader = new GLTFLoader();
        
        let baseScale = 0.11; 
        const modeSelect = document.getElementById('mode-select');

        function updateBretzelScale() {
            if (!bretzel) return;
            let factor = 1.0;
            if (modeSelect.value === 'easy') factor = 2.25; 
            if (modeSelect.value === 'hard') factor = 0.35; 
            
            let finalScale = baseScale * factor;
            bretzel.scale.set(finalScale, finalScale, finalScale);
        }

        modeSelect.addEventListener('change', updateBretzelScale);

        const textureLoader = new THREE.TextureLoader();
        const bretzelTex = textureLoader.load('./object/bretzel.jpg');
        bretzelTex.colorSpace = THREE.SRGBColorSpace;

        const auraMaterial = new THREE.MeshBasicMaterial({
            color: 0xffd700,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.BackSide 
        });

        gltfLoader.load('./object/bretzel.glb', function (gltf) { 
            bretzel = gltf.scene;
            
            const meshesWithAura = [];
            bretzel.traverse((child) => {
                if (child.isMesh) {
                    child.material.map = bretzelTex;
                    child.material.needsUpdate = true;
                    meshesWithAura.push(child);
                }
            });
            
            meshesWithAura.forEach((child) => {
                const aura = child.clone();
                aura.material = auraMaterial;
                aura.userData.baseScale = child.scale.clone(); 
                child.parent.add(aura); 
                auras.push(aura); 
            });
            
            bretzel.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100
            );
            pivot.add(bretzel); 
            updateBretzelScale(); 
        });
        
        const videoElement = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('webcam-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let prevX = 0, prevY = 0;
        let activeState = "REST";
        let lastRawState = "REST";
        let rawStateTime = performance.now();
        let movementLockTime = performance.now();

        let restartTimer = null;
        let countdownInterval = null;
        let countdownValue = 3;

        function startCountdown() {
            if (restartTimer) return; 
            
            countdownValue = 3;
            countdownOverlay.innerText = countdownValue;
            countdownOverlay.style.display = 'block';

            countdownInterval = setInterval(() => {
                countdownValue--;
                if (countdownValue > 0) {
                    countdownOverlay.innerText = countdownValue;
                } else {
                    countdownOverlay.innerText = i18n[currentLang].startMsg;
                }
            }, 1000);

            restartTimer = setTimeout(() => {
                clearInterval(countdownInterval);
                countdownOverlay.style.display = 'none';
                restartTimer = null;
                
                camera.position.z = 250;
                pivot.position.set(0, 0, 0);
                pivot.rotation.set(0, 0, 0);
                bretzel.position.set(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
                bretzelFound = false;
                
                const victoryMsg = document.getElementById('victory-message');
                victoryMsg.style.display = 'none';
                victoryMsg.classList.remove('minimized', 'fade-out'); 
            }, 4000);
        }

        function cancelCountdown() {
            if (restartTimer) {
                clearTimeout(restartTimer);
                clearInterval(countdownInterval);
                restartTimer = null;
                countdownOverlay.style.display = 'none';
            }
        }

        const hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

        hands.onResults((results) => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    window.drawConnectors(canvasCtx, landmarks, window.HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    window.drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});
                }
            }
            canvasCtx.restore();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const wrist = landmarks[0];
                const thumbTip = landmarks[4], thumbIp = landmarks[3], thumbMcp = landmarks[2];
                const indexTip = landmarks[8], indexPip = landmarks[6], indexMcp = landmarks[5];
                const middleTip = landmarks[12], middlePip = landmarks[10];
                const ringTip = landmarks[16], ringPip = landmarks[14];
                const pinkyTip = landmarks[20], pinkyPip = landmarks[18], pinkyMcp = landmarks[17];

                const indexClosed = indexTip.y > indexPip.y, middleClosed = middleTip.y > middlePip.y;
                const ringClosed = ringTip.y > ringPip.y, pinkyClosed = pinkyTip.y > pinkyPip.y;

                const isOpen = !indexClosed && !middleClosed && !ringClosed && !pinkyClosed; 
                const isTwoFingers = !indexClosed && !middleClosed && ringClosed && pinkyClosed; 
                const isPointer = !indexClosed && middleClosed && ringClosed && pinkyClosed; 
                
                const thumbIsStraightUp = (thumbTip.y < thumbIp.y) && (thumbTip.y < thumbMcp.y); 
                const isSideways = Math.abs(indexMcp.x - pinkyMcp.x) < 0.08; 
                const isThumbsUp = indexClosed && middleClosed && ringClosed && pinkyClosed && thumbIsStraightUp && (thumbTip.y < indexMcp.y - 0.05) && isSideways; 
                const isFist = indexClosed && middleClosed && ringClosed && pinkyClosed && !isThumbsUp; 
                
                secretBlinkActive = indexClosed && middleClosed && ringClosed && !pinkyClosed && thumbIsStraightUp;

                let rawState = "REST"; 
                if (isFist) rawState = "REST"; 
                else if (isOpen) rawState = "OPEN"; 
                else if (isTwoFingers) rawState = "TWO_FINGERS"; 
                else if (isPointer) rawState = "POINTER"; 
                else if (isThumbsUp) rawState = "RESTART"; 

                const now = performance.now();
                
                if (rawState !== lastRawState) {
                    lastRawState = rawState;
                    rawStateTime = now;
                }

                if (now - rawStateTime > 100) {
                    if (activeState !== rawState) {
                        activeState = rawState;
                        movementLockTime = now; 
                        
                        prevX = wrist.x;
                        prevY = wrist.y;
                    }
                }

                let cx = wrist.x;
                let cy = wrist.y;
                let dx = cx - prevX;
                let dy = cy - prevY;

                if (activeState !== "RESTART") cancelCountdown();

                const t = i18n[currentLang];
                if (activeState === "REST") {
                    modeDisplay.innerText = t.modRest;
                    modeDisplay.className = "fist";
                } else if (activeState === "TWO_FINGERS") {
                    modeDisplay.innerText = t.modFly;
                    modeDisplay.className = "two-fingers";
                } else if (activeState === "POINTER") {
                    modeDisplay.innerText = t.modPan;
                    modeDisplay.className = "pointer";
                } else if (activeState === "RESTART") {
                    modeDisplay.innerText = t.modRestart;
                    modeDisplay.className = "restart";
                    startCountdown(); 
                } else {
                    modeDisplay.innerText = t.modOrbit;
                    modeDisplay.className = "open";
                }

                if (now - movementLockTime > 200 && rawState === activeState) {
                    if (activeState === "TWO_FINGERS") {
                        if (Math.abs(dy) > 0.005) camera.position.z += dy * Math.max(20, camera.position.z * 1.5); 
                    } else if (activeState === "POINTER") {
                        if (Math.abs(dx) > 0.005 || Math.abs(dy) > 0.005) {
                            pivot.position.x -= dx * 100; pivot.position.y -= dy * 100;
                        }
                    } else if (activeState === "OPEN") {
                        if (Math.abs(dx) > 0.005 || Math.abs(dy) > 0.005) {
                            pivot.rotation.y += dx * 3; pivot.rotation.x += dy * 3;
                        }
                    }
                }

                prevX = cx; 
                prevY = cy; 
            }
        });

        const cameraFeed = new window.Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraFeed.start();

        const bretzelWorldPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            
            if (bretzel) {
                const t = performance.now();
                let targetOpacity = 0;

                if (secretBlinkActive) {
                    targetOpacity = (Math.sin(t * 0.01) + 1) / 2;
                    auras.forEach(a => a.scale.copy(a.userData.baseScale).multiplyScalar(1.15));
                } else if (bretzelFound) {
                    const cycle = t % 11000;
                    if (cycle < 4000) {
                        targetOpacity = Math.abs(Math.sin((cycle / 1000) * Math.PI)); 
                    }
                    auras.forEach(a => a.scale.copy(a.userData.baseScale).multiplyScalar(1.05));
                }
                
                auraMaterial.opacity = targetOpacity;

                if (!bretzelFound) {
                    bretzel.getWorldPosition(bretzelWorldPos);
                    
                    if (camera.position.distanceTo(bretzelWorldPos) < 35) { 
                        bretzelFound = true;
                        
                        const victoryMsg = document.getElementById('victory-message');
                        victoryMsg.style.display = 'block';
                        
                        setTimeout(() => {
                            if (bretzelFound) { 
                                victoryMsg.classList.add('fade-out');
                                
                                setTimeout(() => {
                                    if (bretzelFound) {
                                        victoryMsg.classList.add('minimized');
                                        victoryMsg.classList.remove('fade-out');
                                    }
                                }, 500); 
                            }
                        }, 5000);
                                      
                        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, zIndex: 9999 });
                        setTimeout(() => confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 9999 }), 250);
                        setTimeout(() => confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 9999 }), 400);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
